name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run flake8 linting
        run: flake8 app/ --max-line-length=100 --exclude=app/tests/__init__.py

      - name: Run pytest
        env:
          DATABASE_URL: sqlite:///./test.db
        run: pytest app/tests/ -v